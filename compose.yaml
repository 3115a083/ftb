services:
  app:
    image: ghcr.io/3115a083/ftb:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ftb:${DB_PASSWORD}@db:5432/ftb
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftb
      POSTGRES_USER: ftb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ftb-db:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftb -d ftb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
  backend:
    internal: true

volumes:
  ftb-db:
